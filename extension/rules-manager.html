<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>净化规则 · PagePure</title><link rel="stylesheet" href="rules-manager.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="rules-manager.html"><img src="icons/pagepure-48.png" alt=""><span>PagePure<small>让阅读更纯粹</small></span></a><nav aria-label="管理导航"><a class="nav-item" href="rules-manager.html" aria-current="page"><span aria-hidden="true">▤</span> 净化规则</a></nav><p class="local-note">规则保存在此浏览器中</p></aside>
<main>
<header><div class="eyebrow">你的阅读空间</div><h1>净化规则</h1><p class="intro">整理已保存的规则，让网页回到你想要的样子。</p></header>
<section class="workspace" aria-label="规则列表">
<div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索网站或页面地址" aria-label="搜索网站或页面地址" autocomplete="off"></label><button id="refresh" class="secondary" type="button">刷新</button></div>
<div class="list-heading"><h2>已保存的地址 <span id="total">—</span></h2><span id="ruleTotal" class="muted"></span></div>
<div class="selection-bar"><label class="select-all"><input id="selectAll" type="checkbox"><span>全选当前结果</span></label><div class="selection-actions"><span id="selectedCount" class="muted">未选择</span><button id="clearSelection" class="text-button" type="button" hidden>取消选择</button><button id="deleteSelected" class="danger-button" type="button" disabled>清理所选</button></div></div>
<div id="entries" class="entries"></div><div id="empty" class="empty" hidden><div class="empty-icon" aria-hidden="true">✓</div><h3 id="emptyTitle">还没有保存的规则</h3><p id="emptyDescription">在网页中保存净化设置后，可以在这里统一管理。</p></div>
</section>
<p id="status" role="status" aria-live="polite"></p>
<p class="footnote">清理后，对应地址将不再应用这些已保存的规则。</p>
</main>
<dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmDescription"><form method="dialog"><div class="dialog-mark" aria-hidden="true">↺</div><h2 id="confirmTitle">清理所选规则？</h2><p id="confirmDescription"></p><ul id="confirmEntries"></ul><p id="dialogStatus" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="cancelDelete" class="secondary" value="cancel">取消</button><button id="confirmDelete" class="danger-button" type="button">确认清理</button></div></form></dialog>
<script src="rules-manager.js"></script>
</body></html>
